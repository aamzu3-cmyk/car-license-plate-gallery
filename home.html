<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحات السيارات السعودية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            text-align: center;
        }
        
        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
        }
        
        h1 {
            color: #1a472a;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        a {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            transition: all 0.3s;
            font-size: 1.05em;
        }
        
        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(26, 71, 42, 0.3);
        }
        
        .plates-btn {
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 100%) !important;
        }
        
        .other-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        }
        
        .section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        
        h2 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        
        .links-grid a {
            padding: 12px 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 مرحباً بك</h1>
        <p>منصة لوحات السيارات السعودية</p>
        
        <div class="button-group">
            <a href="saudi-plates.html" class="plates-btn">🚗 عرض لوحات السيارات</a>
        </div>
        
        <div class="section">
            <h2>📱 التطبيقات الأخرى</h2>
            <div class="links-grid">
                <a href="index.html" class="other-btn">📝 المهام</a>
                <a href="clock.html" class="other-btn">🕐 الساعة</a>
                <a href="joke.html" class="other-btn">😂 النكات</a>
                <a href="weather.html" class="other-btn">🌤️ الطقس</a>
            </div>
        </div>
    </div>
</body>
</html>
